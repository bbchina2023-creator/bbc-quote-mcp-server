openapi: 3.1.0
info:
  title: BBC KP Generator Manager Actions
  version: 1.0.1-final
  description: >-
    Manager-facing Release C contract. ChatGPT performs source-first semantic intake and
    submits a Canonical Deal Contract v1. Business validation remains authoritative in
    the deterministic backend; this schema defines only the stable transport contract.
servers:
  - url: https://bbc-quote-mcp-server-staging.bbchina2023.workers.dev
security:
  - bearerAuth: []
paths:
  /actions/validate-canonical-deal:
    post:
      operationId: validateCanonicalDeal
      summary: Validate Canonical Deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalDealRequest'
      responses:
        '200':
          description: Validation result
  /actions/recalculate-deal:
    post:
      operationId: recalculateDeal
      summary: Create verified Snapshot v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CanonicalDealRequest'
                - type: object
                  required: [idempotencyKey]
                  properties:
                    idempotencyKey:
                      type: string
                      minLength: 8
      responses:
        '200':
          description: Calculation and snapshot result
  /actions/get-verified-snapshot:
    post:
      operationId: getVerifiedSnapshot
      summary: Get verified Snapshot v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshotId:
                  type: string
                  minLength: 1
                dealId:
                  type: string
                  minLength: 1
                includePayload:
                  type: boolean
                  default: false
              anyOf:
                - required: [snapshotId]
                - required: [dealId]
      responses:
        '200':
          description: Snapshot result
  /actions/generate-quote:
    post:
      operationId: generateQuote
      summary: Generate quote strictly from immutable Snapshot v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId, idempotencyKey]
              properties:
                snapshotId:
                  type: string
                  minLength: 1
                idempotencyKey:
                  type: string
                  minLength: 8
                outputProfile:
                  type: string
                  enum: [FULL_MASTER_WORKBOOK]
                  default: FULL_MASTER_WORKBOOK
      responses:
        '200':
          description: Google Sheets, XLSX and PDF artifacts
  /actions/get-deal-status:
    post:
      operationId: getDealStatus
      summary: Get latest verified state and artifacts for a deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealId]
              properties:
                dealId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Deal status
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CanonicalDealRequest:
      type: object
      required: [canonicalDeal]
      properties:
        canonicalDeal:
          $ref: '#/components/schemas/CanonicalDeal'
    CanonicalDeal:
      type: object
      required:
        - contractVersion
        - canonicalId
        - dealId
        - revision
        - status
        - createdAt
        - createdBy
        - deal
        - items
        - expenses
        - allocations
        - rates
        - paymentSchedules
        - managerDecisions
        - ruleBindings
        - fieldMeta
        - lineage
      properties:
        contractVersion:
          type: string
        canonicalId:
          type: string
        dealId:
          type: string
        revision:
          type: integer
        status:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        deal:
          type: object
          additionalProperties: true
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        expenses:
          type: array
          items:
            type: object
            additionalProperties: true
        allocations:
          type: array
          items:
            type: object
            additionalProperties: true
        rates:
          type: array
          items:
            type: object
            additionalProperties: true
        paymentSchedules:
          type: array
          items:
            type: object
            additionalProperties: true
        managerDecisions:
          type: array
          items:
            type: object
            additionalProperties: true
        ruleBindings:
          type: array
          items:
            type: object
            additionalProperties: true
        fieldMeta:
          type: array
          items:
            type: object
            additionalProperties: true
        lineage:
          type: array
          items:
            type: object
            additionalProperties: true
